name: Compilar mGBA GX 128KB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar entorno devkitPro y dependencias
        run: |
          # Descargar directamente el script instalador desde el repositorio oficial de devkitPro
          sudo apt-get update && sudo apt-get install -y wget
          wget https://githubusercontent.com
          chmod +x ./install-devkitpro-pacman
          sudo ./install-devkitpro-pacman --noconfirm
          
          # Cargar las herramientas en las variables del sistema
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=$DEVKITPRO/devkitPPC
          echo "DEVKITPRO=$DEVKITPRO" >> $GITHUB_ENV
          echo "DEVKITPPC=$DEVKITPPC" >> $GITHUB_ENV
          echo "$DEVKITPPC/bin" >> $GITHUB_PATH
          
          # Instalar los compiladores y las librerías necesarias
          sudo /opt/devkitpro/pacman/bin/pacman -Syu --noconfirm
          sudo /opt/devkitpro/pacman/bin/pacman -S --noconfirm wii-dev wii-portlibs ppc-mxml

      - name: Compilar emulador
        run: |
          make -f Makefile.wii clean
          make -f Makefile.wii

      - name: Guardar boot.dol compilado
        uses: actions/upload-artifact@v4
        with:
          name: mGBAGX-Modificado-128KB
          path: boot.dol
